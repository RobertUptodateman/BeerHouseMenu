<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beer House — меню</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
  <!-- Только знак лари: в Roboto Condensed и шрифтах телевизоров его может не быть -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400&text=%E2%82%BE&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Палитра по логотипу: зелёный хмеля и неоново-жёлтый на светлом фоне */
      --bg: #f7f7ec;
      --text: #14231c;
      --muted: #6b776f;
      --accent: #18634a;
      --highlight: #e8ec94;
      --line: rgba(20, 35, 28, 0.12);
      --danger: #b3261e;
      --brewery: #45534b;
      --price: #0b4f3a;

      /* Маркеры цвета пива */
      --beer-light: #f5c400;
      --beer-amber: #c8421b;
      --beer-dark: #4a2a17;
      --beer-fruit: #d81b60;
      --beer-veg: #5e8c1e;

      /* Размер названий; остальное задаётся долями от него. Подбирается скриптом */
      --fs: 20px;
      /* Добавка к отступу строк, чтобы список занимал всю высоту экрана */
      --extra: 0px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: flex;
      padding: 2.2vh 2.4vw;
      background: var(--bg);
      color: var(--text);
      font-family: "Roboto Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
    }

    .board {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      gap: calc(var(--fs) * 2);
      overflow: hidden;
      font-size: var(--fs);
      line-height: 1.15;
    }

    .col {
      flex: 1 1 0;
      min-width: 0;
      overflow: hidden;
    }

    .row {
      --pad: calc(var(--fs) * 0.18 + var(--extra));
      display: flex;
      align-items: center;
      gap: calc(var(--fs) * 0.4);
      padding: var(--pad) 0;
      border-bottom: 1px solid var(--line);
    }

    .row:last-child {
      border-bottom: 0;
    }

    .head {
      padding-top: 0;
      color: var(--muted);
      font-size: calc(var(--fs) * 0.55);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .head .name span {
      padding: 0.15em 0.6em;
      border-radius: 0.3em;
      font-weight: 700;
      color: var(--accent);
      background: var(--highlight);
    }

    .tap {
      flex: none;
      width: calc(var(--fs) * 1.1);
      text-align: right;
    }

    /* Номер крана оформлен так же, как ABV */
    .row:not(.head) .tap {
      font-size: calc(var(--fs) * 0.8);
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }

    /* Ячейка маркера одной ширины для кружков и шильдиков, чтобы названия шли ровно.
       Отрицательные отступы растягивают её на всю высоту строки, не увеличивая строку */
    .mark {
      flex: none;
      align-self: stretch;
      display: flex;
      align-items: center;
      justify-content: center;
      width: calc(var(--fs) * 0.9);
      margin: calc(3px - var(--pad)) 0;
    }

    .dot {
      width: calc(var(--fs) * 0.9);
      height: calc(var(--fs) * 0.9);
      border-radius: 50%;
    }

    .dot.light {
      background: var(--beer-light);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.3);
    }

    .dot.amber { background: var(--beer-amber); }
    .dot.dark { background: var(--beer-dark); }

    /* Шильдик с вертикальной надписью, читается снизу вверх */
    .tag {
      align-self: stretch;
      display: flex;
      align-items: center;
      justify-content: center;
      width: calc(var(--fs) * 0.7);
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      padding: 0.2em 0;
      border-radius: 0.25em;
      font-size: calc(var(--fs) * 0.44);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.08em;
      color: #fff;
    }

    .tag.fruit { background: var(--beer-fruit); }
    .tag.veg { background: var(--beer-veg); }

    .name {
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Иерархия: сорт крупнее всего; пивоварня жирная, чуть меньше и светлее; стиль того же размера, но обычный */
    .name em {
      font-style: normal;
      font-weight: 700;
      font-size: 0.86em;
      color: var(--brewery);
    }

    .name em::after {
      content: "/";
      margin: 0 0.3em;
      font-weight: 400;
      color: rgba(20, 35, 28, 0.3);
    }

    .name b {
      font-weight: 700;
    }

    .name i {
      margin-left: 0.5em;
      font-style: normal;
      font-size: 0.86em;
      color: var(--muted);
    }

    /* Метка сорта рядом с названием */
    .badge {
      display: inline-block;
      margin-left: 0.45em;
      padding: 0.18em 0.4em;
      border-radius: 0.3em;
      vertical-align: 0.2em;
      font-size: 0.52em;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.06em;
      color: #fff;
    }

    .badge.new { background: var(--danger); }
    .badge.last { background: #e07b00; }

    /* Раскладка «стиль под названием»: уже по ширине, выше по высоте */
    .stack .name .line,
    .stack .name i {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stack .name i {
      margin-left: 0;
      line-height: 1.1;
    }

    .num {
      flex: none;
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* Ширины в единицах --fs, чтобы мелкий заголовок совпадал со строками */
    .abv { width: calc(var(--fs) * 2.5); }
    .ibu { width: calc(var(--fs) * 1.7); }
    .vol { width: calc(var(--fs) * 1.6); }
    .price { width: calc(var(--fs) * 2.3); }

    /* Все цифры одного размера; у цены жирная только сама сумма */
    .row:not(.head) .num {
      font-size: calc(var(--fs) * 0.8);
      color: var(--muted);
    }

    .row:not(.head) .price {
      font-weight: 700;
      color: var(--price);
    }

    .cur {
      margin-left: 0.12em;
      padding-right: 0.08em;
      font-family: "Noto Sans Georgian", "Segoe UI", system-ui, sans-serif;
      font-weight: 400;
    }

    .off {
      opacity: 0.35;
    }

    .off .price {
      text-decoration: line-through;
    }

    .status {
      position: fixed;
      right: 1vw;
      bottom: 0.6vh;
      font-size: 1.4vh;
      color: var(--danger);
    }

    .empty {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      font-size: 3vh;
      color: var(--muted);
    }

    .empty[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main id="board" class="board"></main>
  <span id="status" class="status" aria-live="polite"></span>
  <p id="empty" class="empty">Загрузка меню…</p>

  <script>
    const POLL_MS = 15000;
    // Сначала Worker: отдаёт JSON прямо из репозитория, без ожидания сборки Pages.
    // Если он недоступен — файл с Pages. Локально — только локальный файл
    const WORKER_URL = "https://bh-menu-oauth.beerhouse.workers.dev/menu";
    const DATA_URL = "data/menu.json";
    const IS_LOCAL = ["localhost", "127.0.0.1"].includes(location.hostname);
    const SOURCES = IS_LOCAL ? [DATA_URL] : [WORKER_URL, DATA_URL];
    const MIN_FS = 8;
    const MAX_FS = 200;
    const DOTS = ["light", "amber", "dark"];
    const TAGS = { fruit: "FRUIT", veg: "VEG" };
    const BADGES = { new: "NEW", last: "LAST KEG" };

    const board = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const emptyEl = document.getElementById("empty");

    let menu = { core: [], guest: [] };
    let lastRaw = null;

    function formatNumber(value) {
      if (value === null || value === undefined || value === "") return "";
      const n = Number(value);
      return Number.isFinite(n) ? n.toLocaleString("ru-RU", { maximumFractionDigits: 1 }) : String(value);
    }

    // Основной формат — общий список taps с разделителем: выше — базовые краны, ниже — гостевые.
    // Старые форматы (core/guest, beers, одна позиция) тоже поддерживаются
    function normalize(data) {
      if (data && Array.isArray(data.taps)) {
        const split = data.taps.findIndex((item) => item && item.type === "divider");
        const isBeer = (item) => item && item.type !== "divider";
        if (split < 0) return { core: data.taps.filter(isBeer), guest: [] };
        return {
          core: data.taps.slice(0, split).filter(isBeer),
          guest: data.taps.slice(split + 1).filter(isBeer)
        };
      }
      if (data && (Array.isArray(data.core) || Array.isArray(data.guest))) {
        return { core: data.core || [], guest: data.guest || [] };
      }
      if (data && Array.isArray(data.beers)) return { core: data.beers, guest: [] };
      if (data && typeof data === "object" && "name" in data) return { core: [data], guest: [] };
      throw new Error("Неверный формат меню");
    }

    function cell(className, text) {
      const span = document.createElement("span");
      span.className = className;
      span.textContent = text;
      return span;
    }

    function headRow(title) {
      const row = document.createElement("div");
      row.className = "row head";
      const name = document.createElement("span");
      name.className = "name";
      name.append(cell("", title));

      row.append(
        cell("tap", ""),
        cell("mark", ""),
        name,
        cell("num abv", "ABV"),
        cell("num ibu", "IBU"),
        cell("num vol", ""),
        cell("num price", "")
      );
      return row;
    }

    function beerRow(beer, tap) {
      const row = document.createElement("div");
      row.className = beer.available === false ? "row off" : "row";

      const mark = cell("mark", "");
      if (TAGS[beer.color]) {
        mark.append(cell("tag " + beer.color, TAGS[beer.color]));
      } else {
        mark.append(cell("dot " + (DOTS.includes(beer.color) ? beer.color : "light"), ""));
      }

      const name = document.createElement("span");
      name.className = "name";
      const line = document.createElement("span");
      line.className = "line";
      if (beer.brewery) {
        const brewery = document.createElement("em");
        brewery.textContent = beer.brewery;
        line.append(brewery);
      }
      const title = document.createElement("b");
      title.textContent = beer.name || "";
      line.append(title);
      if (BADGES[beer.badge]) line.append(cell("badge " + beer.badge, BADGES[beer.badge]));
      name.append(line);
      if (beer.style) {
        const style = document.createElement("i");
        style.textContent = beer.style;
        name.append(style);
      }

      const abv = formatNumber(beer.abv);
      const price = formatNumber(beer.price);
      const vol = String(beer.glass || beer.volume || "").startsWith("0.33") ? "0,33" : "0,45";

      const priceCell = cell("num price", price);
      if (price) priceCell.append(cell("cur", "₾"));

      row.append(
        cell("tap", String(tap)),
        mark,
        name,
        cell("num abv", abv ? abv + "%" : ""),
        cell("num ibu", Number(beer.ibu) > 0 ? formatNumber(beer.ibu) : "—"),
        cell("num vol", vol),
        priceCell
      );
      return row;
    }

    // Номера кранов: сверху вниз по базовым, затем продолжаются в гостевых
    function build() {
      const core = document.createElement("div");
      core.className = "col";
      core.append(headRow("Core beer"), ...menu.core.map((b, i) => beerRow(b, i + 1)));

      const guest = document.createElement("div");
      guest.className = "col";
      guest.append(headRow("Guest beer"), ...menu.guest.map((b, i) => beerRow(b, menu.core.length + i + 1)));

      board.replaceChildren(core, guest);
    }

    function fits(fs) {
      board.style.setProperty("--fs", fs + "px");
      for (const col of board.children) {
        if (col.scrollHeight > col.clientHeight + 1) return false;
      }
      // Строки целиком (цифры не влезли) и названия/стили (обрезаны многоточием)
      for (const el of board.querySelectorAll(".row, .row:not(.head) .name, .row:not(.head) .name > *")) {
        if (el.scrollWidth > el.clientWidth + 1) return false;
      }
      return true;
    }

    function maxFontSize() {
      let lo = MIN_FS;
      let hi = MAX_FS;
      let ok = 0;
      while (hi - lo > 0.25) {
        const mid = (lo + hi) / 2;
        if (fits(mid)) {
          ok = mid;
          lo = mid;
        } else {
          hi = mid;
        }
      }
      return ok;
    }

    // Свободную высоту делим между строками, чтобы меню занимало экран целиком
    function spreadRows(fs) {
      let perRow = Infinity;
      for (const col of board.children) {
        const used = col.lastElementChild.getBoundingClientRect().bottom - col.getBoundingClientRect().top;
        perRow = Math.min(perRow, (col.clientHeight - used) / col.children.length);
      }
      const extra = Math.max(0, Math.min(perRow, fs * 0.8)) / 2;
      board.style.setProperty("--extra", Math.floor(extra * 10) / 10 + "px");
    }

    // Две раскладки строки; для каждой — максимальный шрифт, при котором всё помещается
    function fit() {
      if (!menu.core.length && !menu.guest.length) return;

      board.style.setProperty("--extra", "0px");
      build();
      let best = null;
      for (const stack of [false, true]) {
        board.classList.toggle("stack", stack);
        const fs = maxFontSize();
        if (fs && (!best || fs > best.fs)) best = { stack, fs };
      }
      if (!best) best = { stack: true, fs: MIN_FS };

      const fs = Math.floor(best.fs * 4) / 4;
      board.classList.toggle("stack", best.stack);
      board.style.setProperty("--fs", fs + "px");
      spreadRows(fs);
    }

    async function fetchMenuText() {
      for (const url of SOURCES) {
        try {
          const response = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
          if (response.ok) return await response.text();
        } catch (error) {
          // Источник недоступен — пробуем следующий
        }
      }
      throw new Error("Меню недоступно");
    }

    async function loadMenu() {
      try {
        const raw = await fetchMenuText();
        if (raw !== lastRaw) {
          menu = normalize(JSON.parse(raw));
          lastRaw = raw;
          const isEmpty = !menu.core.length && !menu.guest.length;
          emptyEl.hidden = !isEmpty;
          if (isEmpty) {
            emptyEl.textContent = "Меню пока пусто.";
            board.replaceChildren();
          }
          fit();
        }
        statusEl.textContent = "";
      } catch (error) {
        if (lastRaw) {
          statusEl.textContent = "Не удалось обновить меню";
        } else {
          emptyEl.hidden = false;
          emptyEl.textContent = "Меню временно недоступно.";
        }
      }
    }

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(fit, 150);
    });

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(fit);
    }

    loadMenu();
    setInterval(loadMenu, POLL_MS);
  </script>
</body>
</html>
