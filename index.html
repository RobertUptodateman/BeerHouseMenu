<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beer House — меню</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
  <!-- Только знак лари: в Roboto Condensed и шрифтах телевизоров его может не быть -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@500&text=%E2%82%BE&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Палитра по логотипу: зелёный хмеля и неоново-жёлтый на светлом фоне */
      --bg: #f7f7ec;
      --text: #14231c;
      --muted: #6b776f;
      --accent: #18634a;
      --highlight: #e8ec94;
      --line: rgba(20, 35, 28, 0.12);
      --danger: #b3261e;

      /* Маркеры цвета пива */
      --beer-light: #e8b43a;
      --beer-amber: #b5532a;
      --beer-dark: #3b2418;
      --beer-fruit: #c2185b;

      /* Размер названий; остальное задаётся долями от него. Подбирается скриптом */
      --fs: 20px;
      /* Добавка к отступу строк, чтобы список занимал всю высоту экрана */
      --extra: 0px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: flex;
      padding: 2.2vh 2.4vw;
      background: var(--bg);
      color: var(--text);
      font-family: "Roboto Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
    }

    .board {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      gap: calc(var(--fs) * 2);
      overflow: hidden;
      font-size: var(--fs);
      line-height: 1.15;
    }

    .col {
      flex: 1 1 0;
      min-width: 0;
      overflow: hidden;
    }

    .row {
      display: flex;
      align-items: baseline;
      gap: calc(var(--fs) * 0.4);
      padding: calc(var(--fs) * 0.18 + var(--extra)) 0;
      border-bottom: 1px solid var(--line);
    }

    .row:last-child {
      border-bottom: 0;
    }

    .head {
      padding-top: 0;
      color: var(--muted);
      font-size: calc(var(--fs) * 0.5);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .head .name span {
      padding: 0.15em 0.6em;
      border-radius: 0.3em;
      font-weight: 700;
      color: var(--accent);
      background: var(--highlight);
    }

    .tap {
      flex: none;
      width: calc(var(--fs) * 1.1);
      text-align: right;
      font-size: calc(var(--fs) * 0.55);
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }

    .dot {
      flex: none;
      align-self: center;
      width: calc(var(--fs) * 0.42);
      height: calc(var(--fs) * 0.42);
      border-radius: 50%;
    }

    .head .dot {
      visibility: hidden;
    }

    .dot.light { background: var(--beer-light); }
    .dot.amber { background: var(--beer-amber); }
    .dot.dark { background: var(--beer-dark); }
    .dot.fruit { background: var(--beer-fruit); }

    .name {
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .name b {
      font-weight: 700;
    }

    .name i {
      margin-left: 0.5em;
      font-style: normal;
      font-size: 0.6em;
      color: var(--muted);
    }

    /* Раскладка «стиль под названием»: уже по ширине, выше по высоте */
    .stack .name b,
    .stack .name i {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stack .name i {
      margin-left: 0;
      line-height: 1.1;
    }

    .num {
      flex: none;
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* Ширины в единицах --fs, чтобы мелкий заголовок совпадал со строками */
    .abv { width: calc(var(--fs) * 1.9); }
    .ibu { width: calc(var(--fs) * 1.3); }
    .vol { width: calc(var(--fs) * 1.5); }
    .price { width: calc(var(--fs) * 2.3); }

    .row:not(.head) .abv,
    .row:not(.head) .ibu,
    .row:not(.head) .vol {
      font-size: calc(var(--fs) * 0.58);
      color: var(--muted);
    }

    .row:not(.head) .price {
      font-size: calc(var(--fs) * 0.9);
      font-weight: 700;
      color: var(--accent);
    }

    .cur {
      margin-left: 0.12em;
      font-family: "Noto Sans Georgian", "Segoe UI", system-ui, sans-serif;
      font-size: 0.75em;
      font-weight: 500;
    }

    .off {
      opacity: 0.35;
    }

    .off .price {
      text-decoration: line-through;
    }

    .status {
      position: fixed;
      right: 1vw;
      bottom: 0.6vh;
      font-size: 1.4vh;
      color: var(--danger);
    }

    .empty {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      font-size: 3vh;
      color: var(--muted);
    }

    .empty[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main id="board" class="board"></main>
  <span id="status" class="status" aria-live="polite"></span>
  <p id="empty" class="empty">Загрузка меню…</p>

  <script>
    // Опрос JSON каждые 45 секунд, без кэша Pages/браузера
    const POLL_MS = 45000;
    const DATA_URL = "data/menu.json";
    const MIN_FS = 8;
    const MAX_FS = 200;
    const COLORS = ["light", "amber", "dark", "fruit"];

    const board = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const emptyEl = document.getElementById("empty");

    let menu = { core: [], guest: [] };
    let lastRaw = null;

    function formatNumber(value) {
      if (value === null || value === undefined || value === "") return "";
      const n = Number(value);
      return Number.isFinite(n) ? n.toLocaleString("ru-RU", { maximumFractionDigits: 1 }) : String(value);
    }

    // Старые форматы (одна позиция или список beers) показываются как базовые краны
    function normalize(data) {
      if (data && (Array.isArray(data.core) || Array.isArray(data.guest))) {
        return { core: data.core || [], guest: data.guest || [] };
      }
      if (data && Array.isArray(data.beers)) return { core: data.beers, guest: [] };
      if (data && typeof data === "object" && "name" in data) return { core: [data], guest: [] };
      throw new Error("Неверный формат меню");
    }

    function cell(className, text) {
      const span = document.createElement("span");
      span.className = className;
      span.textContent = text;
      return span;
    }

    function headRow(title) {
      const row = document.createElement("div");
      row.className = "row head";
      const name = document.createElement("span");
      name.className = "name";
      name.append(cell("", title));

      row.append(
        cell("tap", ""),
        cell("dot", ""),
        name,
        cell("num abv", "ABV"),
        cell("num ibu", "IBU"),
        cell("num vol", ""),
        cell("num price", "")
      );
      return row;
    }

    function beerRow(beer, tap) {
      const row = document.createElement("div");
      row.className = beer.available === false ? "row off" : "row";

      const color = COLORS.includes(beer.color) ? beer.color : "light";

      const name = document.createElement("span");
      name.className = "name";
      const title = document.createElement("b");
      title.textContent = beer.name || "";
      name.append(title);
      if (beer.style) {
        const style = document.createElement("i");
        style.textContent = beer.style;
        name.append(style);
      }

      const abv = formatNumber(beer.abv);
      const price = formatNumber(beer.price);
      // Объём показываем только для нестандартного бокала 0,33
      const vol = String(beer.glass || beer.volume || "").startsWith("0.33") ? "0,33" : "";

      const priceCell = cell("num price", price);
      if (price) priceCell.append(cell("cur", "₾"));

      row.append(
        cell("tap", String(tap)),
        cell("dot " + color, ""),
        name,
        cell("num abv", abv ? abv + "%" : ""),
        cell("num ibu", Number(beer.ibu) > 0 ? formatNumber(beer.ibu) : "—"),
        cell("num vol", vol),
        priceCell
      );
      return row;
    }

    // Номера кранов: сверху вниз по базовым, затем продолжаются в гостевых
    function build() {
      const core = document.createElement("div");
      core.className = "col";
      core.append(headRow("Core"), ...menu.core.map((b, i) => beerRow(b, i + 1)));

      const guest = document.createElement("div");
      guest.className = "col";
      guest.append(headRow("Guest"), ...menu.guest.map((b, i) => beerRow(b, menu.core.length + i + 1)));

      board.replaceChildren(core, guest);
    }

    function fits(fs) {
      board.style.setProperty("--fs", fs + "px");
      for (const col of board.children) {
        if (col.scrollHeight > col.clientHeight + 1) return false;
      }
      // Строки целиком (цифры не влезли) и названия/стили (обрезаны многоточием)
      for (const el of board.querySelectorAll(".row, .row:not(.head) .name, .row:not(.head) .name > *")) {
        if (el.scrollWidth > el.clientWidth + 1) return false;
      }
      return true;
    }

    function maxFontSize() {
      let lo = MIN_FS;
      let hi = MAX_FS;
      let ok = 0;
      while (hi - lo > 0.25) {
        const mid = (lo + hi) / 2;
        if (fits(mid)) {
          ok = mid;
          lo = mid;
        } else {
          hi = mid;
        }
      }
      return ok;
    }

    // Свободную высоту делим между строками, чтобы меню занимало экран целиком
    function spreadRows(fs) {
      let perRow = Infinity;
      for (const col of board.children) {
        const used = col.lastElementChild.getBoundingClientRect().bottom - col.getBoundingClientRect().top;
        perRow = Math.min(perRow, (col.clientHeight - used) / col.children.length);
      }
      const extra = Math.max(0, Math.min(perRow, fs * 0.8)) / 2;
      board.style.setProperty("--extra", Math.floor(extra * 10) / 10 + "px");
    }

    // Две раскладки строки; для каждой — максимальный шрифт, при котором всё помещается
    function fit() {
      if (!menu.core.length && !menu.guest.length) return;

      board.style.setProperty("--extra", "0px");
      build();
      let best = null;
      for (const stack of [false, true]) {
        board.classList.toggle("stack", stack);
        const fs = maxFontSize();
        if (fs && (!best || fs > best.fs)) best = { stack, fs };
      }
      if (!best) best = { stack: true, fs: MIN_FS };

      const fs = Math.floor(best.fs * 4) / 4;
      board.classList.toggle("stack", best.stack);
      board.style.setProperty("--fs", fs + "px");
      spreadRows(fs);
    }

    async function loadMenu() {
      try {
        const response = await fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);

        const raw = await response.text();
        if (raw !== lastRaw) {
          menu = normalize(JSON.parse(raw));
          lastRaw = raw;
          const isEmpty = !menu.core.length && !menu.guest.length;
          emptyEl.hidden = !isEmpty;
          if (isEmpty) {
            emptyEl.textContent = "Меню пока пусто.";
            board.replaceChildren();
          }
          fit();
        }
        statusEl.textContent = "";
      } catch (error) {
        if (lastRaw) {
          statusEl.textContent = "Не удалось обновить меню";
        } else {
          emptyEl.hidden = false;
          emptyEl.textContent = "Меню временно недоступно.";
        }
      }
    }

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(fit, 150);
    });

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(fit);
    }

    loadMenu();
    setInterval(loadMenu, POLL_MS);
  </script>
</body>
</html>
