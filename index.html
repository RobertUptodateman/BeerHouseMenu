<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beer House — меню</title>
  <!-- Старый API шрифтов: css2 многие браузеры телевизоров не понимают -->
  <link href="https://fonts.googleapis.com/css?family=Roboto+Condensed:400,700&amp;subset=latin,cyrillic" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Noto+Sans+Georgian:400&amp;text=%E2%82%BE" rel="stylesheet">
  <!--
    Страница должна работать во встроенных браузерах телевизоров (старые движки Chrome/WebKit),
    поэтому без CSS-переменных, flex-gap, inset и без современного JS (async, стрелки, const, replaceChildren).
    Палитра по логотипу: зелёный хмеля #18634a и неоново-жёлтый #e8ec94 на светлом фоне.
  -->
  <style>
    * {
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f7f7ec;
    }

    body {
      position: relative;
      color: #14231c;
      font-family: "Roboto Condensed", "Arial Narrow", "Segoe UI", Arial, sans-serif;
    }

    /* Абсолютное позиционирование: на ТВ height:100% + flex часто даёт нулевую высоту и белый экран */
    .board {
      position: absolute;
      top: 2.2%;
      right: 2.4%;
      bottom: 2.2%;
      left: 2.4%;
      display: -webkit-flex;
      display: flex;
      overflow: hidden;
      font-size: 20px;
      line-height: 1.15;
    }

    .col {
      -webkit-flex: 1 1 0%;
      flex: 1 1 0%;
      min-width: 0;
      overflow: hidden;
    }

    .row {
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      border-bottom: 1px solid rgba(20, 35, 28, 0.12);
    }

    .row:last-child {
      border-bottom: 0;
    }

    .head {
      padding-top: 0 !important;
      color: #6b776f;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .head .name span {
      padding: 0.15em 0.6em;
      border-radius: 0.3em;
      font-weight: 700;
      color: #18634a;
      background: #e8ec94;
    }

    .tap {
      -webkit-flex: none;
      flex: none;
      text-align: right;
    }

    /* Номер крана оформлен так же, как ABV */
    .row.beer .tap {
      color: #6b776f;
    }

    /* Ячейка маркера одной ширины для кружков и шильдиков, чтобы названия шли ровно.
       Отрицательные вертикальные отступы (задаются скриптом) растягивают её на всю высоту строки */
    .mark {
      -webkit-flex: none;
      flex: none;
      -webkit-align-self: stretch;
      align-self: stretch;
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: center;
      justify-content: center;
    }

    .dot {
      border-radius: 50%;
    }

    .dot.light {
      background: #f5c400;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.3);
    }

    .dot.amber { background: #c8421b; }
    .dot.dark { background: #4a2a17; }

    /* Шильдик с вертикальной надписью, читается снизу вверх */
    .tag {
      -webkit-align-self: stretch;
      align-self: stretch;
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: center;
      justify-content: center;
      -webkit-writing-mode: vertical-rl;
      writing-mode: vertical-rl;
      -webkit-transform: rotate(180deg);
      transform: rotate(180deg);
      padding: 0.2em 0;
      border-radius: 0.25em;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.08em;
      color: #fff;
    }

    .tag.fruit { background: #d81b60; }
    .tag.veg { background: #5e8c1e; }

    .name {
      -webkit-flex: 1 1 auto;
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Иерархия: сорт крупнее всего; пивоварня жирная, чуть меньше и светлее; стиль того же размера, но обычный */
    .name em {
      font-style: normal;
      font-weight: 700;
      font-size: 0.86em;
      color: #45534b;
    }

    .name em:after {
      content: "/";
      margin: 0 0.3em;
      font-weight: 400;
      color: rgba(20, 35, 28, 0.3);
    }

    .name b {
      font-weight: 700;
    }

    .name i {
      margin-left: 0.5em;
      font-style: normal;
      font-size: 0.86em;
      color: #6b776f;
    }

    /* Метка сорта рядом с названием */
    .badge {
      display: inline-block;
      margin-left: 0.45em;
      padding: 0.18em 0.4em;
      border-radius: 0.3em;
      vertical-align: 0.2em;
      font-size: 0.52em;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.06em;
      color: #fff;
    }

    .badge.new { background: #b3261e; }
    .badge.last { background: #e07b00; }

    /* Раскладка «стиль под названием»: уже по ширине, выше по высоте */
    .stack .name .line,
    .stack .name i {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stack .name i {
      margin-left: 0;
      line-height: 1.1;
    }

    .num {
      -webkit-flex: none;
      flex: none;
      text-align: right;
      white-space: nowrap;
    }

    .row.beer .num {
      color: #6b776f;
    }

    /* Все цифры одного размера; у цены жирная только сама сумма */
    .row.beer .price {
      font-weight: 700;
      color: #0b4f3a;
    }

    .cur {
      margin-left: 0.12em;
      padding-right: 0.08em;
      font-family: "Noto Sans Georgian", "Segoe UI", Arial, sans-serif;
      font-weight: 400;
    }

    .off {
      opacity: 0.35;
    }

    .off .price {
      text-decoration: line-through;
    }

    .status {
      position: fixed;
      right: 1vw;
      bottom: 0.6vh;
      font-size: 1.4vh;
      color: #b3261e;
    }

    .empty {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      -webkit-justify-content: center;
      justify-content: center;
      margin: 0;
      padding: 0 5vw;
      text-align: center;
      font-size: 3vh;
      color: #6b776f;
    }

    .empty.hide {
      display: none;
    }
  </style>
  <!-- Размеры, зависящие от подобранного шрифта; заполняется скриптом -->
  <style id="sizes"></style>
</head>
<body>
  <div id="board" class="board"></div>
  <span id="status" class="status"></span>
  <p id="empty" class="empty">Загрузка меню…</p>
  <noscript><p class="empty">Включите JavaScript, чтобы показать меню.</p></noscript>

  <script>
    var POLL_MS = 15000;
    // Сначала Worker: отдаёт JSON прямо из репозитория, без ожидания сборки Pages.
    // Если он недоступен — файл с Pages. Локально — только локальный файл
    var WORKER_URL = "https://bh-menu-oauth.beerhouse.workers.dev/menu";
    var DATA_URL = "data/menu.json";
    var IS_LOCAL = location.hostname === "localhost" || location.hostname === "127.0.0.1";
    // Сначала тот же сайт (Pages) — на ТВ кросс-доменный запрос к Worker часто зависает.
    // Worker пробуем вторым: если ответит, следующее обновление будет быстрее.
    var SOURCES = IS_LOCAL ? [DATA_URL] : [DATA_URL, WORKER_URL];
    var REQUEST_TIMEOUT_MS = 4000;
    var MIN_FS = 8;
    var MAX_FS = 200;
    var DOTS = { light: true, amber: true, dark: true };
    var TAGS = { fruit: "FRUIT", veg: "VEG" };
    var BADGES = { "new": "NEW", last: "LAST KEG" };

    var board = document.getElementById("board");
    var statusEl = document.getElementById("status");
    var emptyEl = document.getElementById("empty");
    var sizesEl = document.getElementById("sizes");

    var menu = { core: [], guest: [] };
    var lastRaw = null;

    // Ошибку скрипта показываем на экране: на телевизоре нет консоли разработчика
    window.onerror = function (message, source, line) {
      var text = "Ошибка: " + message + (line ? " (строка " + line + ")" : "");
      if (lastRaw) {
        statusEl.textContent = text;
      } else {
        emptyEl.className = "empty";
        emptyEl.textContent = text;
      }
    };

    function px(fs, k) {
      return Math.round(fs * k * 100) / 100 + "px";
    }

    // Все размеры — доли от размера названий fs
    function applySizes(fs, extra) {
      var pad = fs * 0.18 + extra;
      sizesEl.textContent =
        ".board{font-size:" + px(fs, 1) + "}" +
        ".col+.col{margin-left:" + px(fs, 2) + "}" +
        ".row{padding:" + px(pad, 1) + " 0}" +
        ".row>*+*{margin-left:" + px(fs, 0.4) + "}" +
        ".head{font-size:" + px(fs, 0.55) + "}" +
        ".tap{width:" + px(fs, 1.1) + "}" +
        ".row.beer .tap,.row.beer .num{font-size:" + px(fs, 0.8) + "}" +
        ".mark{width:" + px(fs, 0.9) + ";margin-top:" + px(3 - pad, 1) + ";margin-bottom:" + px(3 - pad, 1) + "}" +
        ".dot{width:" + px(fs, 0.9) + ";height:" + px(fs, 0.9) + "}" +
        ".tag{width:" + px(fs, 0.7) + ";font-size:" + px(fs, 0.44) + "}" +
        ".abv{width:" + px(fs, 2.5) + "}" +
        ".ibu{width:" + px(fs, 1.7) + "}" +
        ".vol{width:" + px(fs, 1.6) + "}" +
        ".price{width:" + px(fs, 2.3) + "}";
    }

    function formatNumber(value) {
      if (value === null || value === undefined || value === "") return "";
      var n = Number(value);
      if (isNaN(n)) return String(value);
      return String(Math.round(n * 10) / 10).replace(".", ",");
    }

    function isBeer(item) {
      return item && item.type !== "divider";
    }

    // Основной формат — общий список taps с разделителем: выше — базовые краны, ниже — гостевые.
    // Старые форматы (core/guest, beers, одна позиция) тоже поддерживаются
    function normalize(data) {
      if (data && data.taps && data.taps.length >= 0) {
        var split = -1;
        for (var i = 0; i < data.taps.length; i++) {
          if (data.taps[i] && data.taps[i].type === "divider") {
            split = i;
            break;
          }
        }
        function beers(from, to) {
          var list = [];
          for (var j = from; j < to; j++) {
            if (isBeer(data.taps[j])) list.push(data.taps[j]);
          }
          return list;
        }
        if (split < 0) return { core: beers(0, data.taps.length), guest: [] };
        return { core: beers(0, split), guest: beers(split + 1, data.taps.length) };
      }
      if (data && (data.core && data.core.length >= 0 || data.guest && data.guest.length >= 0)) {
        return { core: data.core || [], guest: data.guest || [] };
      }
      if (data && data.beers && data.beers.length >= 0) return { core: data.beers, guest: [] };
      if (data && typeof data === "object" && "name" in data) return { core: [data], guest: [] };
      throw new Error("Неверный формат меню");
    }

    function el(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }

    function appendAll(parent, children) {
      for (var i = 0; i < children.length; i++) parent.appendChild(children[i]);
      return parent;
    }

    function headRow(title) {
      var name = el("span", "name");
      name.appendChild(el("span", "", title));
      return appendAll(el("div", "row head"), [
        el("span", "tap"),
        el("span", "mark"),
        name,
        el("span", "num abv", "ABV"),
        el("span", "num ibu", "IBU"),
        el("span", "num vol"),
        el("span", "num price")
      ]);
    }

    function beerRow(beer, tap) {
      var mark = el("span", "mark");
      if (TAGS[beer.color]) {
        mark.appendChild(el("span", "tag " + beer.color, TAGS[beer.color]));
      } else {
        mark.appendChild(el("span", "dot " + (DOTS[beer.color] ? beer.color : "light")));
      }

      var line = el("span", "line");
      if (beer.brewery) line.appendChild(el("em", "", beer.brewery));
      line.appendChild(el("b", "", beer.name || ""));
      if (BADGES[beer.badge]) line.appendChild(el("span", "badge " + beer.badge, BADGES[beer.badge]));

      var name = el("span", "name");
      name.appendChild(line);
      if (beer.style) name.appendChild(el("i", "", beer.style));

      var abv = formatNumber(beer.abv);
      var price = formatNumber(beer.price);
      var vol = String(beer.glass || beer.volume || "").indexOf("0.33") === 0 ? "0,33" : "0,45";

      var priceCell = el("span", "num price", price);
      if (price) priceCell.appendChild(el("span", "cur", "₾"));

      return appendAll(el("div", beer.available === false ? "row beer off" : "row beer"), [
        el("span", "tap", String(tap)),
        mark,
        name,
        el("span", "num abv", abv ? abv + "%" : ""),
        el("span", "num ibu", Number(beer.ibu) > 0 ? formatNumber(beer.ibu) : "—"),
        el("span", "num vol", vol),
        priceCell
      ]);
    }

    function clearBoard() {
      while (board.firstChild) board.removeChild(board.firstChild);
    }

    // Номера кранов: сверху вниз по базовым, затем продолжаются в гостевых
    function build() {
      var i;
      var core = el("div", "col");
      core.appendChild(headRow("Core beer"));
      for (i = 0; i < menu.core.length; i++) core.appendChild(beerRow(menu.core[i], i + 1));

      var guest = el("div", "col");
      guest.appendChild(headRow("Guest beer"));
      for (i = 0; i < menu.guest.length; i++) guest.appendChild(beerRow(menu.guest[i], menu.core.length + i + 1));

      clearBoard();
      board.appendChild(core);
      board.appendChild(guest);
    }

    function setStack(stack) {
      board.className = stack ? "board stack" : "board";
    }

    function fits(fs) {
      applySizes(fs, 0);
      var i;
      var cols = board.children;
      for (i = 0; i < cols.length; i++) {
        if (cols[i].scrollHeight > cols[i].clientHeight + 1) return false;
      }
      // Строки целиком (цифры не влезли) и названия/стили (обрезаны многоточием)
      var items = board.querySelectorAll(".row, .row.beer .name, .row.beer .line, .row.beer .name i");
      for (i = 0; i < items.length; i++) {
        if (items[i].scrollWidth > items[i].clientWidth + 1) return false;
      }
      return true;
    }

    function maxFontSize() {
      var lo = MIN_FS;
      var hi = MAX_FS;
      var ok = 0;
      while (hi - lo > 0.25) {
        var mid = (lo + hi) / 2;
        if (fits(mid)) {
          ok = mid;
          lo = mid;
        } else {
          hi = mid;
        }
      }
      return ok;
    }

    // Свободную высоту делим между строками, чтобы меню занимало экран целиком
    function spreadRows(fs) {
      var perRow = Infinity;
      var cols = board.children;
      for (var i = 0; i < cols.length; i++) {
        var col = cols[i];
        var last = col.children[col.children.length - 1];
        var used = last.getBoundingClientRect().bottom - col.getBoundingClientRect().top;
        perRow = Math.min(perRow, (col.clientHeight - used) / col.children.length);
      }
      var extra = Math.max(0, Math.min(perRow, fs * 0.8)) / 2;
      applySizes(fs, Math.floor(extra * 10) / 10);
    }

    // Две раскладки строки; для каждой — максимальный шрифт, при котором всё помещается
    function fit() {
      if (!menu.core.length && !menu.guest.length) return;

      build();
      var best = null;
      var layouts = [false, true];
      for (var i = 0; i < layouts.length; i++) {
        setStack(layouts[i]);
        var size = maxFontSize();
        if (size && (!best || size > best.fs)) best = { stack: layouts[i], fs: size };
      }
      if (!best) best = { stack: true, fs: MIN_FS };

      var fs = Math.floor(best.fs * 4) / 4;
      setStack(best.stack);
      applySizes(fs, 0);
      spreadRows(fs);
    }

    // XMLHttpRequest вместо fetch — есть в любом, даже очень старом браузере
    function request(url, onSuccess, onFail) {
      var xhr = new XMLHttpRequest();
      var done = false;
      var timer = null;
      function finish(ok, text) {
        if (done) return;
        done = true;
        if (timer) clearTimeout(timer);
        if (ok) onSuccess(text);
        else onFail();
      }
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        if (xhr.status >= 200 && xhr.status < 300) finish(true, xhr.responseText);
        else finish(false);
      };
      xhr.onerror = function () { finish(false); };
      xhr.ontimeout = function () { finish(false); };
      timer = setTimeout(function () {
        try { xhr.abort(); } catch (e) {}
        finish(false);
      }, REQUEST_TIMEOUT_MS);
      try {
        xhr.open("GET", url + (url.indexOf("?") < 0 ? "?" : "&") + "t=" + new Date().getTime(), true);
        try { xhr.timeout = REQUEST_TIMEOUT_MS; } catch (e) {}
        xhr.send();
      } catch (error) {
        finish(false);
      }
    }

    // Источники по очереди: при ошибке — следующий
    function fetchMenuText(onSuccess, onFail, index) {
      index = index || 0;
      if (index >= SOURCES.length) {
        onFail();
        return;
      }
      request(SOURCES[index], onSuccess, function () {
        fetchMenuText(onSuccess, onFail, index + 1);
      });
    }

    function showMenu(raw) {
      if (raw !== lastRaw) {
        menu = normalize(JSON.parse(raw));
        lastRaw = raw;
        var isEmpty = !menu.core.length && !menu.guest.length;
        emptyEl.className = isEmpty ? "empty" : "empty hide";
        if (isEmpty) {
          emptyEl.textContent = "Меню пока пусто.";
          clearBoard();
        }
        fit();
      }
      statusEl.textContent = "";
    }

    function showLoadError() {
      if (lastRaw) {
        statusEl.textContent = "Не удалось обновить меню";
      } else {
        emptyEl.className = "empty";
        emptyEl.textContent = "Меню временно недоступно.";
      }
    }

    function loadMenu() {
      fetchMenuText(function (raw) {
        try {
          showMenu(raw);
        } catch (error) {
          window.onerror(error.message);
        }
      }, showLoadError);
    }

    var resizeTimer = null;
    function onResize() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(fit, 150);
    }
    if (window.addEventListener) window.addEventListener("resize", onResize);
    else if (window.attachEvent) window.attachEvent("onresize", onResize);

    // После загрузки веб-шрифтов ширина текста меняется — подбираем размер заново
    if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
      document.fonts.ready.then(fit);
    }
    if (window.addEventListener) window.addEventListener("load", fit);
    else if (window.attachEvent) window.attachEvent("onload", fit);

    loadMenu();
    setInterval(loadMenu, POLL_MS);
  </script>
</body>
</html>
