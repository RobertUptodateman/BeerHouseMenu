<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beer House — меню</title>
  <style>
    :root {
      --bg: #161411;
      --card: #231f1a;
      --text: #f3ead8;
      --muted: #b7aa94;
      --accent: #d4a017;
      --danger: #c45c3e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 48px;
    }

    h1 {
      margin: 0 0 8px;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 1.1rem;
    }

    .status {
      min-height: 1.4em;
      margin: 0 0 24px;
      font-family: system-ui, sans-serif;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .status.error {
      color: var(--danger);
    }

    .card {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid #3a332b;
      border-radius: 12px;
      padding: 28px 24px;
    }

    .card.unavailable {
      opacity: 0.72;
    }

    .name {
      margin: 0 0 6px;
      font-size: 1.75rem;
    }

    .style {
      margin: 0 0 20px;
      color: var(--accent);
      letter-spacing: 0.04em;
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 16px;
      margin: 0 0 20px;
      font-family: system-ui, sans-serif;
      font-size: 0.95rem;
    }

    .meta dt {
      margin: 0;
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .meta dd {
      margin: 4px 0 0;
    }

    .price {
      margin: 0;
      font-size: 1.5rem;
    }

    .badge {
      display: inline-block;
      margin-top: 16px;
      padding: 4px 10px;
      border-radius: 999px;
      font-family: system-ui, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: #2f4a32;
      color: #c8e0c4;
    }

    .card.unavailable .badge {
      background: #4a2c26;
      color: #f0c4b8;
    }

    .placeholder {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <h1>Beer House</h1>
  <p id="status" class="status" aria-live="polite"></p>

  <article id="card" class="card" hidden>
    <h2 id="name" class="name"></h2>
    <p id="style" class="style"></p>
    <dl class="meta">
      <div>
        <dt>Крепость</dt>
        <dd id="abv"></dd>
      </div>
      <div>
        <dt>IBU</dt>
        <dd id="ibu"></dd>
      </div>
      <div>
        <dt>Объём</dt>
        <dd id="volume"></dd>
      </div>
      <div>
        <dt>Цена</dt>
        <dd id="price" class="price"></dd>
      </div>
    </dl>
    <span id="badge" class="badge"></span>
  </article>

  <p id="empty" class="placeholder">Загрузка меню…</p>

  <script>
    // Опрос JSON каждые 45 секунд, без кэша Pages/браузера
    const POLL_MS = 45000;
    const DATA_URL = "data/menu.json";

    const el = {
      status: document.getElementById("status"),
      card: document.getElementById("card"),
      empty: document.getElementById("empty"),
      name: document.getElementById("name"),
      style: document.getElementById("style"),
      abv: document.getElementById("abv"),
      ibu: document.getElementById("ibu"),
      volume: document.getElementById("volume"),
      price: document.getElementById("price"),
      badge: document.getElementById("badge"),
    };

    let lastData = null;

    function setStatus(text, isError) {
      el.status.textContent = text;
      el.status.classList.toggle("error", Boolean(isError));
    }

    function render(data) {
      const available = Boolean(data.available);

      el.name.textContent = data.name;
      el.style.textContent = data.style;
      el.abv.textContent = data.abv + " %";
      el.ibu.textContent = String(data.ibu);
      el.volume.textContent = data.volume;
      el.price.textContent = data.price + " ₽";
      el.badge.textContent = available ? "В наличии" : "Нет в наличии";
      el.card.classList.toggle("unavailable", !available);
      el.card.hidden = false;
      el.empty.hidden = true;
    }

    async function loadMenu() {
      try {
        const response = await fetch(DATA_URL + "?t=" + Date.now(), {
          cache: "no-store",
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();
        lastData = data;
        render(data);
        setStatus("", false);
      } catch (error) {
        if (lastData) {
          setStatus("Не удалось обновить меню. Показаны последние данные.", true);
        } else {
          el.empty.hidden = false;
          el.empty.textContent = "Меню временно недоступно.";
          setStatus("Не удалось загрузить меню.", true);
        }
      }
    }

    loadMenu();
    setInterval(loadMenu, POLL_MS);
  </script>
</body>
</html>
