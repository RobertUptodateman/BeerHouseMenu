backend:
  name: github
  repo: RobertUptodateman/BeerHouseMenu
  branch: master
  # URL Cloudflare Worker для OAuth, без завершающего "/"
  base_url: https://bh-menu-oauth.beerhouse.workers.dev
  commit_messages:
    update: "Обновление меню: {{slug}}"

# Работает только на localhost с запущенным `npx decap-server`, на Pages игнорируется
local_backend: true

locale: ru

# Обязательное поле Decap; загрузка картинок пока не используется
media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: menu
    label: Меню
    delete: false
    editor:
      preview: false
    files:
      - name: taps
        label: Краны
        file: data/menu.json
        format: json
        fields:
          # Один общий список: всё выше разделителя — базовые краны (левая колонка),
          # ниже — гостевые (правая). Перетаскивание через разделитель переносит позицию в другую колонку
          - name: taps
            label: Краны
            hint: "Номер крана = порядок в списке. Позиции выше разделителя «Гостевые краны» — базовые (левая колонка), ниже — гостевые (правая). Чтобы перенести позицию в другую колонку, перетащите её через разделитель."
            label_singular: позицию
            widget: list
            collapsed: true
            types:
              - name: beer
                label: Пиво
                widget: object
                summary: "{{fields.brewery}} · {{fields.name}} · {{fields.style}} · {{fields.price}} ₾"
                fields:
                  - { name: brewery, label: Пивоварня, widget: string, required: false }
                  - { name: name, label: Название сорта, widget: string }
                  - { name: style, label: "Стиль (на английском)", widget: string, required: false }
                  - { name: abv, label: "ABV, %", widget: number, value_type: float, min: 0, step: 0.1 }
                  - { name: ibu, label: IBU, widget: number, value_type: int, min: 0, required: false }
                  - name: color
                    label: Цвет пива (маркер)
                    widget: select
                    default: light
                    options:
                      - { label: "Светлое", value: light }
                      - { label: "Тёмное", value: dark }
                      - { label: "Янтарное / красное", value: amber }
                      - { label: "Фруктовое (шильдик FRUIT)", value: fruit }
                      - { label: "Овощное (шильдик VEG)", value: veg }
                  - name: glass
                    label: Бокал
                    widget: select
                    default: "0.45"
                    options:
                      - { label: "0,45 (стандартный)", value: "0.45" }
                      - { label: "0,33", value: "0.33" }
                  - name: badge
                    label: Метка
                    hint: "Показывается рядом с названием. Оставьте пустым, если метка не нужна."
                    widget: select
                    required: false
                    options:
                      - { label: "NEW — новинка", value: new }
                      - { label: "LAST KEG — последний кег", value: last }
                  - { name: price, label: "Цена, ₾", widget: number, value_type: float, min: 0, step: 0.5 }
                  - { name: available, label: В наличии, widget: boolean, default: true }
              # Текст summary используется скриптом в admin/index.html, чтобы не считать разделитель краном
              - name: divider
                label: "Разделитель «Гостевые краны»"
                widget: object
                summary: "▼ ГОСТЕВЫЕ КРАНЫ ▼"
                fields:
                  - { name: column, widget: hidden, default: guest }
